services:
  - type: web
    name: ginas-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: DATABASE_URL_OVERRIDE
        sync: false
      - key: DB_ENGINE
        value: postgresql
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: '["https://ginas-tennis-world-eta.vercel.app"]'
      - key: FRONTEND_URL
        value: https://ginas-tennis-world-eta.vercel.app
      - key: EMAIL_PROVIDER
        value: gmail
      - key: SENDGRID_API_KEY
        sync: false
      - key: GMAIL_USER
        value: ginastennisworld@gmail.com
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: JWT_SECRET_PREV
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
        # Generate with: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
        # MUST be set before first deploy — birth_date PII stored plaintext otherwise.
        # After setting, deploy will auto-encrypt any existing plaintext values at startup.
      - key: REDIS_URL
        sync: false
        # Upstash Redis URL (optional) — enables class listing cache. Get from upstash.com free tier.
      - key: CONTACT_EMAIL
        value: ginastennisworld@gmail.com
      - key: EMAIL_FROM_ADDRESS
        value: ginastennisworld@gmail.com
      - key: EMAIL_FROM_NAME
        value: "Gina's Tennis World"